name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем предыдущие прогоны для той же ветки: экономит время раннеров.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Точный патч, а не "1.26": setup-go подбирает старший доступный патч
  # семейства, и он может отставать от версии, где закрыты уязвимости
  # стандартной библиотеки. govulncheck это ловит и валит сборку.
  #
  # При появлении новых уязвимостей эту версию нужно поднимать — за этим
  # следит еженедельный прогон security.yml.
  GO_VERSION: "1.26.6"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # Экшен восьмой версии работает с golangci-lint второй мажорной
        # версии — именно её формат использует .golangci.yml. Шестая ставила
        # линтер v1, который такой конфиг прочитать не может.
        #
        # Версия зафиксирована намеренно: с latest сборка ломается при
        # выходе новой версии линтера, хотя код не менялся.
        uses: golangci/golangci-lint-action@v8
        with:
          # Версия совпадает с локальной: тогда «прошло локально» означает
          # «пройдёт в CI».
          #
          # ВАЖНО: линтер отказывается анализировать модуль, нацеленный на
          # языковую версию Go новее той, которой собран он сам. Поэтому при
          # подъёме go-директивы в go.mod эту версию нужно поднимать следом —
          # v2.1.0 собрана на Go 1.24 и не работала с go.mod 1.26.
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all services
        run: |
          for svc in billing-service crypto-billing-service tg-bot-gateway \
                     user-subscription-service vpn-orchestrator-service; do
            echo "::group::$svc"
            go build -trimpath -o /dev/null ./cmd/$svc
            echo "::endgroup::"
          done

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with race detector and coverage
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -20
          echo "---"
          go tool cover -func=coverage.out | grep -E 'total:' || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Требуют Docker и потому медленнее: не блокируем быстрые проверки.
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # testcontainers-go сам управляет контейнерами через Docker,
      # который на ubuntu-latest уже установлен.
      - name: Run integration tests
        run: go test -tags=integration ./... -count=1 -timeout=15m

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...