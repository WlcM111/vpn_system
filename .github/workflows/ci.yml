name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем предыдущие прогоны для той же ветки: экономит время раннеров.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Держим в актуальной версии: govulncheck падает на уязвимостях
  # стандартной библиотеки, исправленных в свежих патчах.
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Линтеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # После первого зелёного прогона стоит зафиксировать конкретную
          # версию вместо latest — иначе обновление линтера может внезапно
          # уронить CI на коде, который не менялся.
          version: latest
          args: --timeout=5m

  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Сборка всех сервисов
        run: |
          for svc in billing-service crypto-billing-service tg-bot-gateway \
                     user-subscription-service vpn-orchestrator-service; do
            echo "::group::$svc"
            go build -trimpath -o /dev/null ./cmd/$svc
            echo "::endgroup::"
          done

  test:
    name: Unit-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Тесты с детектором гонок и покрытием
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Покрытие ключевых пакетов
        run: |
          go tool cover -func=coverage.out | tail -20
          echo "---"
          go tool cover -func=coverage.out | grep -E 'total:' || true

      - name: Выгрузить отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    # Требуют Docker и потому медленнее: не блокируем быстрые проверки.
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # testcontainers-go сам управляет контейнерами через Docker,
      # который на ubuntu-latest уже установлен.
      - name: Интеграционные тесты
        run: go test -tags=integration ./... -count=1 -timeout=15m

  govulncheck:
    name: Уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Проверка известных уязвимостей
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...