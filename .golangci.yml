# Статический анализ.
#
# Набор подобран так, чтобы ловить реальные дефекты, а не навязывать стиль.
# Каждое исключение сопровождается причиной: конфиг без объяснений
# неотличим от «отключил, чтобы замолчало».
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck      # необработанные ошибки
    - govet         # подозрительные конструкции
    - staticcheck   # широкий набор проверок корректности
    - ineffassign   # присваивания, результат которых не используется
    # unused отключён осознанно: крипто-оплата и привязка карты реализованы
    # полностью (сервис crypto-billing, рекуррентные профили, ретраи, grace),
    # но намеренно не выведены в интерфейс. Код сохранён на случай возврата
    # функциональности — удалять работающую реализацию ради линтера не стоит.
    - ineffassign   # присваивания, результат которых не используется
    - gosec         # проблемы безопасности
    - gosec         # проблемы безопасности
    - bodyclose     # незакрытые http.Response.Body
    - errorlint     # неверная работа с обёрнутыми ошибками
    - nilerr        # return nil при ненулевой ошибке

  disable:
    # unused входит в набор standard и включён по умолчанию — убрать его из
    # enable недостаточно, нужно именно disable.
    #
    # Отключён осознанно: крипто-оплата и привязка карты реализованы целиком
    # (сервис crypto-billing, рекуррентные профили, ретраи, grace-период), но
    # намеренно не выведены в интерфейс. Удалять работающую реализацию ради
    # молчания линтера не стоит — при возврате функциональности она понадобится.
    - unused

  settings:
    errcheck:
      exclude-functions:
        # Rollback в defer после успешного Commit возвращает ErrTxClosed —
        # это штатное поведение, а не ошибка.
        - (github.com/jackc/pgx/v5.Tx).Rollback

    staticcheck:
      # ВАЖНО: этот список ЗАМЕНЯЕТ набор по умолчанию, а не дополняет его.
      # Поэтому дефолтные исключения перечислены явно — иначе включаются
      # спорные ST-проверки, которые авторы staticcheck намеренно держат
      # выключенными.
      checks:
        - all
        # --- дефолтные исключения staticcheck, воспроизведены как есть ---
        - -ST1000 # комментарий к пакету: не требуем для внутренних пакетов
        - -ST1003 # имена: пакеты вида crypto_billing и поля вида DirectIp
        #          (последнее диктуется форматом профиля Happ, менять нельзя)
        - -ST1016 # единообразие имён receiver'ов
        - -ST1020 # комментарий к экспортируемой функции
        - -ST1021 # комментарий к экспортируемому типу
        - -ST1022 # комментарий к экспортируемой переменной
        - -ST1023 # избыточные типы в объявлениях
        # --- наше собственное исключение ---
        # QF1007 предлагает схлопывать условное присваивание в объявление
        # переменной. Там, где условий несколько и каждое со своим смыслом,
        # промежуточный флаг читается лучше, чем длинное выражение.
        - -QF1007

    gosec:
      excludes:
        # G101 — детектор «захардкоженных креденшелов» срабатывает на
        # константы, в имени которых есть Token. У нас это подписи кнопок
        # Telegram, а не секреты.
        - G101
        # G115 — переполнение при int -> int32. Значения приходят из
        # собственного конфига (размер пула соединений), не от пользователя.
        - G115
        # G118 — context.Background в горутине. Фоновые воркеры живут дольше
        # запроса и намеренно используют собственный контекст приложения.
        - G118
        # G304 — чтение файла по переменному пути. Путь берётся из переменной
        # окружения, задаваемой оператором при деплое, а не из запроса.
        - G304
        # G705/G706 — «taint analysis» для XSS и log injection. Мы отдаём
        # text/plain с X-Content-Type-Options: nosniff и логируем собственные
        # значения конфигурации, а не пользовательский ввод.
        - G705
        - G706
        # G401/G505 — SHA-1. Используется как детерминированный идентификатор
        # профиля маршрутизации, а не как криптографическая защита.
        - G401
        - G505

  exclusions:
    rules:
      # В тестах допустимы фиксированные креды и необработанные ошибки.
      - path: _test\.go
        linters:
          - gosec
          - errcheck

      # Стаб платёжного API поднимается только в E2E-окружении.
      - path: test/e2e/stub/
        linters:
          - gosec

formatters:
  enable:
    - gofmt