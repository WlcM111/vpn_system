groups:
  - name: money
    interval: 30s
    rules:
      # Сообщение ушло в dead-letter — обработка провалилась 20 раз подряд.
      # Для billing.events это подтверждённый платёж, который не превратился
      # в подписку. Реагировать надо в течение минут, а не суток.
      - alert: KafkaMessageInDLT
        expr: increase(vpn_platform_kafka_consumed_total{status="dlt"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Сообщение ушло в DLT ({{ $labels.topic }})"
          description: >-
            Топик {{ $labels.topic }}: за 10 минут в dead-letter попало
            {{ $value | printf "%.0f" }} сообщений. Если это billing.events —
            платёж подтверждён, но подписка не выдана.
            Смотреть: docker exec vpn-platform-kafka
            /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server
            localhost:9092 --topic {{ $labels.topic }}.dlt --from-beginning
            --max-messages 5 --timeout-ms 10000

      # Платёж принят провайдером, но подписка не активирована. Оба счётчика
      # process-local, поэтому сравниваем приросты за час, а не абсолютные
      # значения: рестарт сервиса не даёт ложного срабатывания.
      # Сравниваются только успешные платежи и применённые активации.
      - alert: PaymentWithoutActivation
        expr: >-
          sum(increase(vpn_platform_billing_payments_total{outcome="succeeded"}[1h]))
          -
          sum(increase(vpn_platform_subscription_activations_total{result="applied"}[1h]))
          > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Платежи без активации подписки"
          description: >-
            За последний час успешных платежей больше, чем применённых
            активаций, на {{ $value | printf "%.0f" }}. Проверить:
            SELECT count(*) FROM payments p LEFT JOIN subscription_grants g
            ON g.source='paid' AND g.business_key = p.payment_id
            WHERE p.status='succeeded'
            AND p.checkout_type='subscription_purchase' AND g.id IS NULL;

      # Событие в outbox не удалось опубликовать после всех попыток.
      # Значит изменение состояния произошло, а downstream о нём не узнал.
      - alert: OutboxEventsFailed
        expr: vpn_platform_outbox_failed_total > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "События outbox в статусе failed"
          description: >-
            В event_outbox {{ $value | printf "%.0f" }} событий со статусом
            failed. Они не доехали до Kafka.

      # Platega: сверка оплат просрочена — воркер не работает или API
      # Platega недоступно. Колбэки Platega повторяет лишь несколько раз,
      # поэтому сверка — единственная гарантия, что оплата не потеряется.
      - alert: PlategaChecksOverdue
        expr: vpn_platform_billing_platega_overdue_checks > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Сверка оплат Platega просрочена"
          description: >-
            {{ $value | printf "%.0f" }} заказов Platega ждут сверки статуса
            дольше 10 минут. Проверить логи billing-service (platega) и
            SELECT order_id, status, last_error, next_check_at FROM payments
            WHERE provider='platega' AND next_check_at < now() - interval '10 minutes';

      - alert: PlategaReconcilerStalled
        expr: >-
          (time() - vpn_platform_billing_platega_reconcile_last_run_timestamp) > 300
          and vpn_platform_billing_platega_reconcile_last_run_timestamp > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Воркер сверки Platega не работает"
          description: >-
            Последний проход воркера сверки Platega был более 5 минут назад.

      # Заказы, требующие решения человека: несовпадение суммы/валюты,
      # спор, чарджбэк, частичный возврат.
      - alert: PlategaPaymentNeedsReview
        expr: sum(vpn_platform_billing_platega_payments{status=~"review_required|disputed|chargebacked|partially_refunded"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Платежи Platega требуют ручной проверки"
          description: >-
            {{ $value | printf "%.0f" }} заказов Platega в статусах
            review_required/disputed/chargebacked/partially_refunded.
            SELECT order_id, telegram_id, status, provider_status, review_reason
            FROM payments WHERE provider='platega'
            AND status IN ('review_required','disputed','chargebacked','partially_refunded');

      # Platega отказывает в создании счетов или не отвечает.
      - alert: PlategaCreateFailing
        expr: sum(increase(vpn_platform_billing_platega_requests_total{op="create",result=~"rejected|ambiguous"}[15m])) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Platega не создаёт счета"
          description: >-
            За 15 минут {{ $value | printf "%.0f" }} неудачных попыток
            создать счёт. Пользователям предлагается «Способ 2». Частая
            причина — неверные PLATEGA_MERCHANT_ID / PLATEGA_SECRET.

      # Колбэки с неверными ключами: ключ в .env не совпадает с ЛК Platega
      # или кто-то перебирает адрес колбэка.
      - alert: PlategaCallbackUnauthorized
        expr: sum(increase(vpn_platform_billing_platega_callbacks_total{result="unauthorized"}[30m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Колбэки Platega отклоняются (неверные ключи)"
          description: >-
            За 30 минут {{ $value | printf "%.0f" }} колбэков отклонено по
            X-MerchantId/X-Secret. Сверить ключи в .env с ЛК Platega.

  - name: pipeline
    interval: 30s
    rules:
      # Консьюмер не успевает или застрял на сообщении. Порог намеренно
      # невысокий: при штатной нагрузке лаг держится около нуля.
      - alert: KafkaConsumerLagHigh
        expr: vpn_platform_kafka_consumer_lag > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Отставание консьюмера {{ $labels.group }} на {{ $labels.topic }}"
          description: >-
            Группа {{ $labels.group }}, топик {{ $labels.topic }},
            партиция {{ $labels.partition }}: отставание
            {{ $value | printf "%.0f" }} сообщений держится 10 минут.

      # Лаг не растёт, но и не убывает — характерный признак сообщения,
      # которое обрабатывается по кругу и не коммитится.
      - alert: KafkaConsumerLagStuck
        expr: min_over_time(vpn_platform_kafka_consumer_lag[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Лаг не уходит: {{ $labels.group }} / {{ $labels.topic }}"
          description: >-
            Партиция {{ $labels.partition }} топика {{ $labels.topic }}
            держит ненулевое отставание уже полчаса. Вероятно, консьюмер
            зациклился на одном сообщении.

      # События, захваченные публикатором и не отмеченные результатом.
      # С арендой (platform/0011) они перезахватываются через 2 минуты;
      # долго висящие — это строки, застрявшие до миграции (locked_at IS NULL).
      - alert: OutboxStuckProcessing
        expr: vpn_platform_outbox_depth{status="processing"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "События outbox зависли в processing"
          description: >-
            {{ $value | printf "%.0f" }} событий в статусе processing дольше
            15 минут. SELECT id, topic, event_type, created_at FROM event_outbox
            WHERE status='processing' ORDER BY id LIMIT 20;

      # Очередь публикации растёт: publisher не успевает или Kafka недоступна.
      - alert: OutboxDepthGrowing
        expr: sum(vpn_platform_outbox_depth{status=~"pending|retry"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Очередь outbox растёт"
          description: >-
            В outbox {{ $value | printf "%.0f" }} неопубликованных событий
            дольше 10 минут.

  - name: infrastructure
    interval: 30s
    rules:
      # Backup не создавался дольше суток с запасом. Метрика пишется скриптом
      # vpn-backup.sh через textfile collector node_exporter. Если node_exporter
      # не установлен, метрики не будет и алерт не сработает — это отдельный
      # риск, отмеченный в конце гайда.
      - alert: BackupMissing
        expr: time() - vpn_backup_last_success_timestamp_seconds > 108000
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Backup не создавался более 30 часов"
          description: >-
            Последний успешный backup был
            {{ $value | humanizeDuration }} назад. Проверить:
            journalctl -u vpn-backup.service -n 50
            # У узла не задана полоса канала. Следствия два: на дашборде канал
      # всегда нулевой, и балансировщик считает узел свободным, даже когда
      # канал забит — новые пользователи продолжают на него распределяться.
      - alert: NodeBandwidthNotConfigured
        expr: vpn_platform_node_bandwidth_configured == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Полоса канала не задана: {{ $labels.title }}"
          description: >-
            У узла {{ $labels.server_key }} ({{ $labels.country }})
            bandwidth_mbps = 0. Загрузка канала не считается, и узел
            участвует в распределении как свободный. Задать:
            UPDATE vpn_servers SET bandwidth_mbps = <Мбит/с>
            WHERE server_key = '{{ $labels.server_key }}';

      # Нода не шлёт heartbeat. Пользователи на ней теряют доступ.
      - alert: NodeDown
        expr: vpn_platform_node_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Нода {{ $labels.title }} не отвечает"
          description: >-
            {{ $labels.server_key }} ({{ $labels.country }}) не присылает
            heartbeat более 5 минут.

      # Сервис перестал отдавать метрики: упал, завис или потерял сеть.
      - alert: ServiceDown
        expr: up{job="vpn-platform-services"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.service }} недоступен"
          description: >-
            Prometheus не может собрать метрики с {{ $labels.service }}
            уже 3 минуты.

      # Ожидания блокировок в Postgres: споры за горячие строки.
      - alert: PostgresLockWaits
        expr: vpn_platform_postgres_lock_waits > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ожидания блокировок в Postgres"
          description: >-
            {{ $value | printf "%.0f" }} сессий ждут блокировку дольше
            5 минут подряд.