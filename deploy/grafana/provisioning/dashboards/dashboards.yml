apiVersion: 1

providers:
  - name: vpn-platform
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # путь внутри контейнера Grafana, куда смонтированы JSON-дашборды
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false